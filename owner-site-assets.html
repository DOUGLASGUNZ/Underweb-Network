<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UnderWeb // Site Assets</title>
<style>
:root{color-scheme:dark;--g:#8dff3f;--bg:#020503;--panel:#071009;--line:#24451f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#0d2512 0,transparent 35%),var(--bg);color:#e8f5e6;font:15px system-ui,sans-serif;min-height:100vh}
main{width:min(760px,calc(100% - 28px));margin:7vh auto}.eyebrow{color:var(--g);letter-spacing:.2em;font-size:12px}.card{margin-top:18px;border:1px solid var(--line);background:#050b07eF;padding:22px;box-shadow:0 0 50px #55ff2210}
h1{margin:.3rem 0;font-size:clamp(28px,7vw,52px)}p{color:#aebbaa;line-height:1.55}.drop{display:block;border:1px dashed #4d7d3d;padding:24px;margin:22px 0;cursor:pointer}.drop:hover{border-color:var(--g)}
input[type=file]{width:100%}input[type=text]{width:100%;padding:13px;background:#020503;border:1px solid #294925;color:white;border-radius:4px}
button{width:100%;padding:14px;border:1px solid var(--g);background:#11240e;color:var(--g);font-weight:800;letter-spacing:.08em;cursor:pointer;margin-top:12px}button:disabled{opacity:.4;cursor:not-allowed}
#preview{max-width:100%;max-height:320px;margin-top:16px;display:none;border:1px solid #1c3518}#status{white-space:pre-wrap;margin-top:16px}.bad{color:#ff6d6d}.good{color:var(--g)}code{word-break:break-all}
</style>
</head>
<body><main><div class="eyebrow">UNDERWEB // OWNER CONTROL</div><h1>SITE ASSETS</h1><p>Upload permanent website artwork into the existing <b>network-media</b> pipeline. Assets stay inside your authenticated owner folder and receive a public URL.</p>
<section class="card"><div id="auth">Checking UnderWeb session…</div>
<label class="drop">Choose artwork<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label>
<img id="preview" alt="Asset preview">
<label>Asset path</label><input id="path" type="text" value="site-assets/os/underweb-hero.webp" autocomplete="off">
<button id="upload" disabled>UPLOAD TO NETWORK</button><div id="status"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./owner-site-assets.js"></script></body></html>
